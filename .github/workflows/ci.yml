name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Nothing here writes: every job reads this repo, and the downstream checkouts get their own
# per-repo App token. A job that ever needs more declares it for itself.
permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the script can reach the merge base with the target branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node .github/scripts/changeset-check.mjs
        env:
          CHANGESET_CHECK_BASE: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
      # `api:diff` reads the API reports at the same merge base and fails an unannounced removal.
      # It needs the toolchain the check above deliberately does without, so it comes second: a
      # missing changeset is reported in seconds, before this install runs.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:diff
        env:
          CHANGESET_CHECK_BASE: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperfixation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # createTestDatabase's ADMIN_URL default points at the local `hf dev` compose port
      # (5434); CI's postgres service is 5432, so this is the "somewhere else" its comment
      # promises. Every test provisions its own database off this admin connection — nothing
      # reads a static DATABASE_URL, and setting one at job level previously shadowed each
      # fixture's own migrated database (resolveApp prefers process.env over a fixture's .env).
      HF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck lint test
      # `core` in a shuffled order, because its process globals make declaration order a real
      # dependency: `defineApp`'s control plane is keyed by app name on the process (#123), so a
      # test that attaches and never detaches decided a later test's answer, and the suite passed
      # only in the order it happens to be written in. Fixed seeds rather than vitest's random
      # one — a job that fails on a different order each run is a flake, and the point is a bug
      # that reproduces. `core` only, at ~5s a seed; `workflows` and `ai` are minutes each because
      # of the real workers. Both were run by hand on these seeds: `ai` is clean, and `workflows`
      # is clean under `--sequence.shuffle.files` but not under the full shuffle, which reorders
      # the cases inside a file too — `run-flow-sync.test.ts` and `redeploy-case-10-launch.test.ts`
      # share one spawned worker across their cases and read what an earlier case assigned. That is
      # coupling inside a file rather than the process-global leak this step guards, and #132 has it.
      - name: core, shuffled
        run: |
          for seed in 1 3 7 11 42; do
            echo "::group::core --sequence.seed=$seed"
            pnpm vitest run --project core --sequence.shuffle --sequence.seed="$seed" \
              || { echo "::error::core failed with --sequence.seed=$seed"; exit 1; }
            echo "::endgroup::"
          done
      # Not folded into the line above: `api-extractor` compares each package's build against
      # its committed `etc/*.api.md` and fails on any difference, so its failure means
      # "the public API changed" rather than "the code is broken".
      - run: pnpm turbo api-extractor

  # One entry per `owner/repo` line of `downstream.txt` — the same file `release:ci` opens the
  # bump PRs from, so an app joins both at once.
  downstream-list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: pnpm downstream:matrix

  # Every downstream app, against this PR's packages rather than the published ones.
  # `template:check` packs every publishable package here and installs the tarballs over the
  # app's `@hyperfixation/*` specs, so a change that compiles in core and does not in an app
  # fails here instead of on that app's main.
  #
  # Named anything but `downstream`: a matrix job's checks are `downstream-matrix (owner/repo)`,
  # and the ruleset requires one called exactly `downstream` — which the aggregate below is.
  downstream-matrix:
    needs: downstream-list
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.downstream-list.outputs.matrix) }}
    name: downstream (${{ matrix.repo }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The app's tests provision a database per test off this admin connection, exactly as the
      # `test` job above and the template's own CI do.
      HF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # A generated app has the template's layout under another name, so `template:check` reads
      # it the same way — only the directory it is pointed at changes.
      HF_TEMPLATE_DIR: ${{ github.workspace }}/downstream
    # Two checkouts, so neither is the workspace root — `actions/checkout` refuses a `path`
    # outside it, which is why the sibling layout `HF_TEMPLATE_DIR` defaults to is built here
    # rather than inherited.
    defaults:
      run:
        working-directory: hyperfixation-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: hyperfixation-core
      # A PR from a fork gets no secrets, and the App is not installed on every owner either.
      # Without a token the checkout below falls back to GITHUB_TOKEN, which reaches a public
      # repo — the template — and fails loudly on a private one rather than checking nothing.
      - id: app
        working-directory: ${{ github.workspace }}
        env:
          APP_ID: ${{ secrets.HF_BOT_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        if: steps.app.outputs.available == 'true'
        with:
          app-id: ${{ secrets.HF_BOT_APP_ID }}
          private-key: ${{ secrets.HF_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: read
      # Pinned to `main`: the question this job answers is whether the app as shipped survives
      # this PR.
      #
      # `persist-credentials: false`: `template:check` runs that repo's own scripts against its
      # own checkout, and a token left in `downstream/.git/config` would be there for them to
      # read. The check only ever reads, so nothing downstream of the clone needs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repo }}
          ref: main
          path: downstream
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hyperfixation-core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm template:check

  # The other half of `downstream`: that job proves an existing app survives this PR, this one
  # proves the CLI can still make an app at all — a fresh global install of the packed `hf`
  # scaffolds the template, brings it up, and the app it produced passes its own tests.
  #
  # Deliberately not a required check, and not named one of the three the ruleset requires: it
  # gates nothing until it has been green for a week.
  #
  # No `postgres` service, unlike every other job here: `hf up` brings the scaffolded app's own
  # `docker-compose.yml` up, which publishes 5432 on the runner, and a service container would
  # already hold that port. The app's own postgres is the one under test.
  scaffold:
    runs-on: ubuntu-latest
    # A wedged `next dev` or a step that never finishes fails the job instead of holding a
    # runner; the check itself bounds its own wait well inside this.
    timeout-minutes: 15
    env:
      HF_TEMPLATE_DIR: ${{ github.workspace }}/hyperfixation-template
      # The scaffolded app's tests provision a database each off an admin connection — its
      # compose postgres, which `hf up` has brought up by then.
      HF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    # Two checkouts, so neither is the workspace root, as in `downstream-matrix` above.
    defaults:
      run:
        working-directory: hyperfixation-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: hyperfixation-core
      # Pinned to `main`: the question is whether this PR's CLI can scaffold the template as
      # shipped.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: grahamlutz/hyperfixation-template
          ref: main
          path: hyperfixation-template
          # `scaffold:check` runs the template's own tooling; see `downstream-matrix` above.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hyperfixation-core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm scaffold:check

  # The name the ruleset requires. `always()` so a cancelled or skipped matrix reports here as a
  # failure instead of leaving the required check pending forever.
  downstream:
    needs: [downstream-list, downstream-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          LIST: ${{ needs.downstream-list.result }}
          MATRIX: ${{ needs.downstream-matrix.result }}
        run: |
          echo "downstream-list: $LIST, downstream-matrix: $MATRIX"
          test "$LIST" = success && test "$MATRIX" = success
