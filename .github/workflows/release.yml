name: Release

# `push: main` only, and deliberately never `pull_request`: the publish step holds
# `id-token: write`, and a fork PR must have no path to it. A fork that pushes to its own `main`
# runs this in the fork, where the `if` below stops it before the token is minted.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, pack and `npm publish --dry-run` — nothing published, no tag, no bump PRs
        type: boolean
        default: false
      recover:
        description: Finish a stranded release — tag main's version and open its bump PRs, publishing nothing
        type: boolean
        default: false

# Two releases in flight would publish the same version twice and race on the tag. Never
# cancelled: a half-published run has to finish or be re-run, not be killed.
concurrency:
  group: release
  cancel-in-progress: false

# Every job asks for what it needs; nothing inherits write access it does not use.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'grahamlutz/hyperfixation-core'
    # On the job, not the workflow: `id-token` is the credential for the whole npm registry here,
    # so any job added later must ask for it on purpose.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.outcome.outputs.version }}
      bump: ${{ steps.outcome.outputs.bump }}
    steps:
      # Before the checkout, so `persist-credentials` stores the App's token: the tag push and the
      # `Version Packages` PR both need it. A PR opened with GITHUB_TOKEN triggers no workflows,
      # and this repo's ruleset requires `test`, `downstream` and `changeset` — so that PR could
      # never merge.
      #
      # `repositories: hyperfixation-core` and nothing else. This token shares a job with
      # `id-token: write`, which is the npm publishing identity; the downstream bump jobs below
      # mint their own, one repo each, so no app repo's code ever runs where either can be read.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.HF_BOT_APP_ID }}
          private-key: ${{ secrets.HF_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hyperfixation-core
          permission-contents: write
          permission-pull-requests: write

      # fetch-depth: 0 for the tags — `release:ci` skips a `v<version>` that already exists.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # npm >= 11.5.1 is the documented OIDC client and node 22 ships npm 10, so trusted
      # publishing needs this. Pinned to the major: `npm@latest` is a moving part of a release.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      # No NPM_TOKEN: `npm publish --provenance` inside `release:ci` mints an OIDC token per run
      # against the trusted publishers configured per package for this workflow file.
      - name: Version or publish
        if: ${{ !inputs.dry_run && !inputs.recover }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm release:version
          publish-script: pnpm release:ci --result ${{ runner.temp }}/release.json
          # `release:ci` tags and reports for itself; the action cannot see what a custom
          # publish script published, so leaving these on would mean no tags at all.
          push-git-tags: false
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # No `changesets/action`, so nothing can open a `Version Packages` PR: the version in this
      # checkout is already published and this run only finishes it. `--recover` publishes
      # nothing — the already-on-npm check skips every package before a tarball is built.
      - name: Recover a stranded release
        if: ${{ inputs.recover && !inputs.dry_run }}
        run: pnpm release:ci --recover --result ${{ runner.temp }}/release.json

      # The only channel between this job and the bump jobs. No file means `release:ci` never ran
      # — the versioning half of `changesets/action` opened a `Version Packages` PR instead — and
      # there is nothing to bump.
      #
      # `!cancelled()` rather than the default `success()`: `release:ci` writes this file before
      # it decides its exit code, so a registry that has not caught up fails the step loudly
      # while the tag it already pushed still reaches the bump jobs. That failure was what
      # stranded 0.1.9.
      - name: Bump decision
        id: outcome
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          RESULT: ${{ runner.temp }}/release.json
        run: |
          if [ ! -f "$RESULT" ]; then echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          {
            echo "version=$(node -p "require(process.env.RESULT).version")"
            echo "bump=$(node -p "require(process.env.RESULT).bumpable")"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: pnpm release:ci --dry-run

  # `downstream.txt`, as one matrix entry per `owner/repo` — the same reader `ci.yml` builds its
  # `downstream` matrix from, so an app joins both at once and the two cannot drift.
  bump-list:
    needs: release
    # `!cancelled()` and not `success()`: `bump` is only ever `true` when `release:ci` confirmed
    # every abbreviated packument serves the version, so a release job that went red on something
    # after that — the registry-agreement wait — must not also swallow the bumps.
    if: ${{ !cancelled() && needs.release.outputs.bump == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: pnpm downstream:matrix

  # One job, one repo, one token. `release:bump` clones that repo and runs `pnpm update` in it —
  # someone else's checkout — so the credential in this job must be worth nothing anywhere else.
  # No `id-token`, no write access to core: a compromised app repo gets a token for itself.
  #
  # `fail-fast: false` is what keeps "one repo refuses, the others still get their PR": the loop
  # that used to do it inside `release:ci` is now the matrix.
  bump:
    needs: [release, bump-list]
    if: ${{ !cancelled() && needs.bump-list.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bump-list.outputs.matrix) }}
    name: bump (${{ matrix.repo }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `persist-credentials: false`: `release:bump` authenticates every git call itself, with the
      # per-repo token below and as a transient header, so no credential is left in a `.git/config`
      # the downstream checkout's own tooling could read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.HF_BOT_APP_ID }}
          private-key: ${{ secrets.HF_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-pull-requests: write
      - run: pnpm release:bump --repo "$REPO" --version "$VERSION"
        env:
          REPO: ${{ matrix.repo }}
          VERSION: ${{ needs.release.outputs.version }}
          HF_BUMP_TOKEN: ${{ steps.app-token.outputs.token }}
